<main>
<section class="wrap narrow">
<h1>Contact me</h1>
<p class="lead">Send me a message and I will reply as soon as I can.</p>
<form id="contactForm" novalidate>
<label for="name">Name</label><input id="name" type="text" autocomplete="name"><span class="error" id="nameErr"></span>
<label for="email">Email address</label><input id="email" type="email" autocomplete="email"><span class="error" id="emailErr"></span>
<label for="phone">Phone number</label><input id="phone" type="tel" autocomplete="tel"><span class="error" id="phoneErr"></span>
<label for="message">Message</label><textarea id="message" rows="5"></textarea><span class="error" id="messageErr"></span>
<button class="btn" type="submit">Send message</button>
<p id="formSuccess" class="success" role="status"></p>
</form>
</section>
</main>
