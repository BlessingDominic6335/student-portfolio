<section class="wrap narrow">
<h1>Academic planner</h1>
<p class="lead">Add what you need to do, tick it off when it is done, and delete it when you no longer need it.</p>
<form id="taskForm" class="row">
<label for="taskInput" class="sr">New task</label>
<input id="taskInput" type="text" placeholder="e.g. Finish COS 106 project" autocomplete="off">
<button class="btn" type="submit">Add task</button>
</form>
<p id="taskError" class="error" role="alert"></p>
<p id="taskCount" class="muted" aria-live="polite"></p>
<ul id="taskList" class="tasks"></ul>
</section>
</main>
